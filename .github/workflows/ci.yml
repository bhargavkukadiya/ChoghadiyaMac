name: CI - macOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Xcode Build & Automated Tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Xcode & System Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build & Run Automated Test Suite
        run: >-
          xcodebuild
          -project ChoghadiyaMac.xcodeproj
          -scheme ChoghadiyaMacApp
          -destination 'platform=macOS'
          -derivedDataPath build/CI
          -onlyUsePackageVersionsFromResolvedFile
          test CODE_SIGNING_ALLOWED=NO
