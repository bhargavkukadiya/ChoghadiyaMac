name: Release - Build & Publish DMG

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build DMG & Publish Release
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show Xcode & System Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Determine Release Version
        id: version
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG_INPUT" ]; then
            TAG="$RELEASE_TAG_INPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.+-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build & Package DMG
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./script/create_dmg.sh "$RELEASE_VERSION"

      - name: Attach DMG Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Choghadiya for Mac v${{ steps.version.outputs.version }}
          files: |
            build/Artifacts/Choghadiya-*.dmg
            build/Artifacts/Choghadiya-*.dmg.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
